<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FlashStudy – Grupos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 30px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f0f0f0;
            margin-top: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        header h1 span {
            color: #a78bfa;
        }

        header p {
            color: #b0b0c0;
            font-size: 0.95rem;
        }

        /* ===== GRUPOS ===== */
        .group-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }

        .group-selector button {
            background: rgba(167, 139, 250, 0.15);
            border: 1px solid rgba(167, 139, 250, 0.2);
            color: #c4b5fd;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .group-selector button:hover {
            background: rgba(167, 139, 250, 0.25);
        }

        .group-selector button.active {
            background: rgba(167, 139, 250, 0.35);
            border-color: #a78bfa;
        }

        .group-selector button.delete-group-btn {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            font-size: 0.75rem;
            padding: 4px 10px;
        }

        .group-selector button.delete-group-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .add-group-form {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .add-group-form input {
            flex: 1;
            min-width: 120px;
            padding: 8px 14px;
            border-radius: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.07);
            color: #f0f0f0;
            font-size: 0.9rem;
            outline: none;
        }

        .add-group-form input::placeholder {
            color: #8888aa;
        }

        .add-group-form button {
            background: #7c3aed;
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .add-group-form button:hover {
            background: #6d28d9;
        }

        /* ===== DECK CONTROLS ===== */
        .deck-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #c0c0d0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a78bfa, #7c3aed);
            border-radius: 12px;
            transition: width 0.3s ease;
        }

        /* ===== FLASHCARD ===== */
        .flashcard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin: 16px 0 20px;
        }

        .flashcard {
            width: 100%;
            max-width: 480px;
            height: 260px;
            perspective: 800px;
            cursor: pointer;
        }

        .flashcard-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .flashcard-front {
            background: linear-gradient(145deg, #1e1b4b, #2d2a5e);
            border: 1px solid rgba(167, 139, 250, 0.25);
        }

        .flashcard-front p {
            color: #f0f0f0;
        }

        .flashcard-back {
            background: linear-gradient(145deg, #1b1a3a, #2a2850);
            transform: rotateY(180deg);
            border: 1px solid rgba(167, 139, 250, 0.2);
        }

        .flashcard-back p {
            color: #c4b5fd;
        }

        .flip-btn {
            background: rgba(167, 139, 250, 0.15);
            border: 1px solid rgba(167, 139, 250, 0.25);
            color: #c4b5fd;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .flip-btn:hover {
            background: rgba(167, 139, 250, 0.25);
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0 20px;
        }

        .nav-btn,
        .reset-btn,
        .delete-btn {
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.06);
            color: #e0e0f0;
        }

        .nav-btn:hover {
            background: rgba(167, 139, 250, 0.2);
            border-color: rgba(167, 139, 250, 0.3);
        }

        .reset-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .danger-zone {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .danger-zone .delete-btn {
            font-size: 0.8rem;
            padding: 6px 14px;
        }

        .add-card {
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 18px;
        }

        .add-card h3 {
            font-size: 1rem;
            font-weight: 400;
            color: #c0c0d0;
            margin-bottom: 12px;
        }

        .add-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .add-form input {
            flex: 1 1 160px;
            padding: 10px 14px;
            border-radius: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.07);
            color: #f0f0f0;
            font-size: 0.95rem;
            outline: none;
            transition: background 0.2s;
        }

        .add-form input::placeholder {
            color: #8888aa;
        }

        .add-form input:focus {
            background: rgba(255, 255, 255, 0.12);
        }

        .add-form button {
            background: #7c3aed;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-form button:hover {
            background: #6d28d9;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1b4b;
            border: 1px solid rgba(167, 139, 250, 0.2);
            color: #f0f0f0;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
        }

        .group-cards-count {
            font-size: 0.75rem;
            color: #8888aa;
            margin-left: 4px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px 14px;
            }

            .flashcard {
                height: 210px;
            }

            .flashcard-front,
            .flashcard-back {
                font-size: 1rem;
                padding: 16px;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .actions {
                gap: 6px;
            }

            .nav-btn,
            .reset-btn,
            .delete-btn {
                padding: 8px 12px;
                font-size: 0.8rem;
            }

            .group-selector button {
                font-size: 0.75rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 <span>Flash</span>Study</h1>
            <p>Estude com flashcards organizados por grupos</p>
        </header>

        <!-- GRUPOS -->
        <div class="add-group-form">
            <input type="text" id="newGroupName" placeholder="Nome do novo grupo..." />
            <button id="addGroupBtn">➕ Criar Grupo</button>
        </div>

        <div class="group-selector" id="groupSelector"></div>

        <!-- DECK CONTROLS -->
        <section class="deck-controls">
            <div class="stats">
                <span id="card-counter">0 / 0</span>
                <span id="progress-percent">0%</span>
                <span id="group-name-display" style="color:#a78bfa;"></span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </section>

        <!-- FLASHCARD -->
        <main class="flashcard-container">
            <div class="flashcard" id="flashcard">
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <p id="question-text">Carregando...</p>
                    </div>
                    <div class="flashcard-back">
                        <p id="answer-text">...</p>
                    </div>
                </div>
            </div>
            <button class="flip-btn" id="flipBtn">🔄 Virar</button>
        </main>

        <!-- AÇÕES -->
        <section class="actions">
            <button class="nav-btn" id="prevBtn">◀ Anterior</button>
            <button class="nav-btn" id="nextBtn">Próximo ▶</button>
            <button class="delete-btn" id="deleteBtn">🗑️ Deletar este</button>
            <button class="reset-btn" id="resetBtn">🔄 Reiniciar</button>
        </section>

        <section class="danger-zone">
            <button class="delete-btn" id="deleteAllBtn">⚠️ Deletar todos do grupo</button>
        </section>

        <!-- ADICIONAR CARD -->
        <section class="add-card">
            <h3>➕ Adicionar flashcard ao grupo atual</h3>
            <div class="add-form">
                <input type="text" id="newQuestion" placeholder="Pergunta..." />
                <input type="text" id="newAnswer" placeholder="Resposta..." />
                <button id="addBtn">Adicionar</button>
            </div>
        </section>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        //  ESTRUTURA DE DADOS
        // ============================================================
        // groups = { "Nome do Grupo": [ { question, answer }, ... ] }
        // ============================================================

        const STORAGE_KEY = 'flashstudy_groups';

        let groups = {};
        let currentGroupName = '';
        let currentIndex = 0;
        let isFlipped = false;

        // Elementos DOM
        const flashcard = document.getElementById('flashcard');
        const questionText = document.getElementById('question-text');
        const answerText = document.getElementById('answer-text');
        const cardCounter = document.getElementById('card-counter');
        const progressFill = document.getElementById('progress-fill');
        const progressPercent = document.getElementById('progress-percent');
        const groupNameDisplay = document.getElementById('group-name-display');
        const groupSelector = document.getElementById('groupSelector');
        const toast = document.getElementById('toast');

        // ============================================================
        //  FUNÇÕES DE PERSISTÊNCIA
        // ============================================================

        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    groups = JSON.parse(stored);
                    if (typeof groups !== 'object' || Array.isArray(groups)) throw new Error();
                    // Garantir que cada grupo seja um array
                    for (const key in groups) {
                        if (!Array.isArray(groups[key])) groups[key] = [];
                    }
                } catch {
                    groups = getDefaultGroups();
                }
            } else {
                groups = getDefaultGroups();
            }
            saveData();
        }

        function getDefaultGroups() {
            return {
                'HTML/CSS': [
                    { question: 'O que é HTML?', answer: 'Linguagem de marcação para estruturar páginas web.' },
                    { question: 'O que é CSS?', answer: 'Linguagem de estilo para definir a aparência das páginas.' }
                ],
                'JavaScript': [
                    { question: 'O que é JavaScript?', answer: 'Linguagem de programação para interatividade no navegador.' },
                    { question: 'O que é uma API?', answer: 'Interface que permite comunicação entre sistemas.' }
                ],
                'Banco de Dados': [
                    { question: 'O que é SQL?', answer: 'Linguagem para gerenciar bancos de dados relacionais.' },
                    { question: 'O que é JSON?', answer: 'Formato leve de troca de dados.' }
                ]
            };
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(groups));
        }

        function getCurrentCards() {
            if (!groups[currentGroupName]) {
                // Se o grupo não existe, criar um vazio
                groups[currentGroupName] = [];
                saveData();
            }
            return groups[currentGroupName];
        }

        function getGroupNames() {
            return Object.keys(groups).sort();
        }

        // ============================================================
        //  TOAST
        // ============================================================

        function showToast(msg, isError = false) {
            toast.textContent = msg;
            toast.style.borderColor = isError ? 'rgba(239, 68, 68, 0.4)' : 'rgba(167, 139, 250, 0.2)';
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ============================================================
        //  RENDERIZAÇÃO
        // ============================================================

        function renderGroupSelector() {
            const names = getGroupNames();
            groupSelector.innerHTML = '';

            if (names.length === 0) {
                const msg = document.createElement('span');
                msg.textContent = 'Nenhum grupo. Crie um!';
                msg.style.color = '#8888aa';
                msg.style.fontSize = '0.9rem';
                groupSelector.appendChild(msg);
                return;
            }

            names.forEach(name => {
                const btn = document.createElement('button');
                btn.textContent = name;
                const count = groups[name] ? groups[name].length : 0;
                const span = document.createElement('span');
                span.className = 'group-cards-count';
                span.textContent = `(${count})`;
                btn.appendChild(span);

                if (name === currentGroupName) {
                    btn.classList.add('active');
                }

                btn.addEventListener('click', () => {
                    switchGroup(name);
                });

                // Botão para deletar o grupo
                const delBtn = document.createElement('button');
                delBtn.textContent = '✕';
                delBtn.className = 'delete-group-btn';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteGroup(name);
                });

                const wrapper = document.createElement('span');
                wrapper.style.display = 'inline-flex';
                wrapper.style.alignItems = 'center';
                wrapper.style.gap = '4px';
                wrapper.appendChild(btn);
                wrapper.appendChild(delBtn);
                groupSelector.appendChild(wrapper);
            });
        }

        function renderCard() {
            const cards = getCurrentCards();

            if (!cards || cards.length === 0) {
                questionText.textContent = 'Nenhum flashcard neste grupo.';
                answerText.textContent = 'Adicione um!';
                cardCounter.textContent = '0 / 0';
                progressFill.style.width = '0%';
                progressPercent.textContent = '0%';
                groupNameDisplay.textContent = currentGroupName ? `📁 ${currentGroupName}` : '';
                return;
            }

            if (currentIndex >= cards.length) {
                currentIndex = cards.length - 1;
            }
            if (currentIndex < 0) currentIndex = 0;

            const card = cards[currentIndex];
            questionText.textContent = card.question;
            answerText.textContent = card.answer;

            cardCounter.textContent = `${currentIndex + 1} / ${cards.length}`;
            const pct = Math.round(((currentIndex + 1) / cards.length) * 100);
            progressFill.style.width = `${pct}%`;
            progressPercent.textContent = `${pct}%`;
            groupNameDisplay.textContent = currentGroupName ? `📁 ${currentGroupName}` : '';

            if (isFlipped) {
                flashcard.classList.remove('flipped');
                isFlipped = false;
            }
        }

        function switchGroup(name) {
            if (!groups[name]) {
                groups[name] = [];
                saveData();
            }
            currentGroupName = name;
            currentIndex = 0;
            renderGroupSelector();
            renderCard();
            showToast(`Grupo: ${name}`);
        }

        // ============================================================
        //  CRUD GRUPOS
        // ============================================================

        function createGroup(name) {
            const trimmed = name.trim();
            if (!trimmed) {
                showToast('Digite um nome para o grupo.', true);
                return;
            }
            if (groups[trimmed]) {
                showToast('Grupo já existe!', true);
                return;
            }
            groups[trimmed] = [];
            saveData();
            switchGroup(trimmed);
            document.getElementById('newGroupName').value = '';
            showToast(`Grupo "${trimmed}" criado! ✅`);
        }

        function deleteGroup(name) {
            if (!groups[name]) return;
            const count = groups[name].length;
            if (!confirm(`Deletar o grupo "${name}" com ${count} cards?`)) return;
            delete groups[name];
            saveData();
            const names = getGroupNames();
            if (names.length > 0) {
                switchGroup(names[0]);
            } else {
                currentGroupName = '';
                currentIndex = 0;
                renderGroupSelector();
                renderCard();
            }
            showToast(`Grupo "${name}" deletado.`);
        }

        function deleteAllCardsInGroup() {
            const cards = getCurrentCards();
            if (!cards || cards.length === 0) {
                showToast('Nenhum card neste grupo.', true);
                return;
            }
            if (!confirm(`Deletar TODOS os ${cards.length} cards do grupo "${currentGroupName}"?`)) return;
            groups[currentGroupName] = [];
            saveData();
            currentIndex = 0;
            renderCard();
            renderGroupSelector();
            showToast('Todos os cards deletados do grupo.');
        }

        // ============================================================
        //  CRUD CARDS
        // ============================================================

        function addCard(question, answer) {
            if (!currentGroupName) {
                showToast('Crie ou selecione um grupo primeiro!', true);
                return;
            }
            if (!question.trim() || !answer.trim()) {
                showToast('Preencha pergunta e resposta!', true);
                return;
            }
            const cards = getCurrentCards();
            cards.push({ question: question.trim(), answer: answer.trim() });
            saveData();
            currentIndex = cards.length - 1;
            renderCard();
            renderGroupSelector();
            document.getElementById('newQuestion').value = '';
            document.getElementById('newAnswer').value = '';
            showToast('Card adicionado! ✅');
        }

        function deleteCurrentCard() {
            if (!currentGroupName) {
                showToast('Nenhum grupo selecionado.', true);
                return;
            }
            const cards = getCurrentCards();
            if (!cards || cards.length === 0) {
                showToast('Nenhum card para deletar.', true);
                return;
            }
            if (cards.length === 1) {
                if (!confirm('Deletar o único card deste grupo?')) return;
                cards.pop();
                saveData();
                currentIndex = 0;
                renderCard();
                renderGroupSelector();
                showToast('Último card deletado.');
                return;
            }
            const cardName = cards[currentIndex].question.substring(0, 30) + (cards[currentIndex].question.length > 30 ? '...' : '');
            if (!confirm(`Deletar o card: "${cardName}"?`)) return;
            cards.splice(currentIndex, 1);
            saveData();
            if (currentIndex >= cards.length) {
                currentIndex = cards.length - 1;
            }
            renderCard();
            renderGroupSelector();
            showToast('Card deletado! 🗑️');
        }

        function resetDeck() {
            if (!currentGroupName) return;
            const cards = getCurrentCards();
            if (!cards || cards.length === 0) return;
            currentIndex = 0;
            renderCard();
            if (isFlipped) {
                flashcard.classList.remove('flipped');
                isFlipped = false;
            }
            showToast('Deck reiniciado!');
        }

        function prevCard() {
            const cards = getCurrentCards();
            if (!cards || cards.length === 0) return;
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = cards.length - 1;
            }
            renderCard();
        }

        function nextCard() {
            const cards = getCurrentCards();
            if (!cards || cards.length === 0) return;
            if (currentIndex < cards.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            renderCard();
        }

        function flipCard() {
            const cards = getCurrentCards();
            if (!cards || cards.length === 0) return;
            flashcard.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        // ============================================================
        //  EVENTOS
        // ============================================================

        document.getElementById('addGroupBtn').addEventListener('click', () => {
            const name = document.getElementById('newGroupName').value;
            createGroup(name);
        });

        document.getElementById('newGroupName').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('addGroupBtn').click();
            }
        });

        document.getElementById('addBtn').addEventListener('click', () => {
            const q = document.getElementById('newQuestion').value;
            const a = document.getElementById('newAnswer').value;
            addCard(q, a);
        });

        document.getElementById('newQuestion').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('newAnswer').focus();
        });
        document.getElementById('newAnswer').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('addBtn').click();
        });

        document.getElementById('flipBtn').addEventListener('click', flipCard);
        document.getElementById('prevBtn').addEventListener('click', prevCard);
        document.getElementById('nextBtn').addEventListener('click', nextCard);
        document.getElementById('resetBtn').addEventListener('click', resetDeck);
        document.getElementById('deleteBtn').addEventListener('click', deleteCurrentCard);
        document.getElementById('deleteAllBtn').addEventListener('click', deleteAllCardsInGroup);

        flashcard.addEventListener('click', flipCard);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevCard();
            else if (e.key === 'ArrowRight') nextCard();
            else if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                flipCard();
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
                deleteCurrentCard();
            }
        });

        // ============================================================
        //  INICIALIZAÇÃO
        // ============================================================

        loadData();

        const names = getGroupNames();
        if (names.length > 0) {
            currentGroupName = names[0];
        } else {
            currentGroupName = '';
            groups['Geral'] = [];
            saveData();
            currentGroupName = 'Geral';

        renderGroupSelector();
