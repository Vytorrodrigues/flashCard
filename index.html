<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="./styles.css">
    <title>FlashStudy – Grupos</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 <span>Flash</span>Study</h1>
            <p>Estude com flashcards organizados por grupos</p>
        </header>

        <!-- GRUPOS -->
        <div class="add-group-form">
            <input type="text" id="newGroupName" placeholder="Nome do novo grupo..." />
            <button id="addGroupBtn">➕ Criar Grupo</button>
        </div>

        <div class="group-selector" id="groupSelector"></div>

        <!-- DECK CONTROLS -->
        <section class="deck-controls">
            <div class="stats">
                <span id="card-counter">0 / 0</span>
                <span id="progress-percent">0%</span>
                <span id="group-name-display" style="color:#a78bfa;"></span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </section>

        <!-- FLASHCARD -->
        <main class="flashcard-container">
            <div class="flashcard" id="flashcard">
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <p id="question-text">Carregando...</p>
                    </div>
                    <div class="flashcard-back">
                        <p id="answer-text">...</p>
                    </div>
                </div>
            </div>
            <button class="flip-btn" id="flipBtn">🔄 Virar</button>
        </main>

        <!-- AÇÕES -->
        <section class="actions">
            <button class="nav-btn" id="prevBtn">◀ Anterior</button>
            <button class="nav-btn" id="nextBtn">Próximo ▶</button>
            <button class="delete-btn" id="deleteBtn">🗑️ Deletar este</button>
            <button class="reset-btn" id="resetBtn">🔄 Reiniciar</button>
        </section>

        <section class="danger-zone">
            <button class="delete-btn" id="deleteAllBtn">⚠️ Deletar todos do grupo</button>
        </section>

        <!-- ADICIONAR CARD -->
        <section class="add-card">
            <h3>➕ Adicionar flashcard ao grupo atual</h3>
            <div class="add-form">
                <input type="text" id="newQuestion" placeholder="Pergunta..." />
                <input type="text" id="newAnswer" placeholder="Resposta..." />
                <button id="addBtn">Adicionar</button>
            </div>
        </section>
    </div>

    <div id="toast" class="toast"></div>

    <script src="./script.js"></script>
</body>
</html>
